<nav
  class="sidenav"
  [class.collapsed]="!isOpen"
  role="navigation"
  aria-label="Barre latérale"
>
  <!-- En-tête / logo -->
  <div class="brand">
    <div class="logo">AP</div>
    <span class="brand-text" *ngIf="isOpen">AutoPlanning</span>

    <button class="btn-toggle" type="button" (click)="toggle()" [attr.aria-label]="isOpen ? 'Réduire' : 'Développer'">
      <i-lucide [name]="isOpen ? 'chevron-left' : 'chevron-right'" [size]="20"></i-lucide>
    </button>
  </div>

  <!-- Navigation -->
  <div class="nav-group">
    <div class="nav-label" *ngIf="isOpen">Navigation</div>

    <a
      *ngFor="let item of navItems; trackBy: trackByRoute"
      class="nav-link"
      [routerLink]="item.route"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: false }"
    >
      <i-lucide class="icon" [name]="item.icon" [size]="20"></i-lucide>
      <span class="text" *ngIf="isOpen">{{ item.label }}</span>
    </a>
  </div>

  <div class="spacer"></div>

  <!-- Pied de barre : paramètres / déconnexion -->
  <div class="footer">
    <a class="nav-link" routerLink="/settings" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
      <i-lucide class="icon" name="settings" [size]="20"></i-lucide>
      <span class="text" *ngIf="isOpen">Paramètres</span>
    </a>

    <button class="nav-link btn-logout" type="button" (click)="logout()">
      <i-lucide class="icon" name="log-out" [size]="20"></i-lucide>
      <span class="text" *ngIf="isOpen">Déconnexion</span>
    </button>
  </div>
</nav>
